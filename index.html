<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共享单词本 · Co-Sharing WordNote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f46e5;
      --primary-h: #4338ca;
      --primary-l: #818cf8;
      --bg: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --sh: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --sh-md: 0 4px 12px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
      --sh-lg: 0 20px 40px rgba(0,0,0,.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }

    /* ── Header ── */
    .header { background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: var(--sh); }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 0 24px; height: 64px; }
    .logo { font-size: 18px; font-weight: 800; color: var(--primary); white-space: nowrap; display: flex; align-items: center; gap: 8px; letter-spacing: -.3px; }
    .logo span { font-size: 22px; }
    .stats-bar { display: flex; gap: 16px; flex: 1; min-width: 0; }
    .stat { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .stat b { color: var(--primary); font-size: 15px; }
    .live { display: flex; align-items: center; gap: 5px; }
    .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(.7);} }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .nick-wrap { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 22px; padding: 5px 14px; transition: border-color .2s; }
    .nick-wrap:focus-within { border-color: var(--primary); }
    .nick-input { border: none; background: transparent; outline: none; font-size: 13px; width: 76px; color: var(--text); }

    .btn-outline {
      background: white; color: var(--muted); border: 1.5px solid var(--border); border-radius: 22px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap;
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-outline.active { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .btn-outline.active:hover { background: #fde68a; }

    .btn-add {
      background: var(--primary); color: white; border: none; border-radius: 22px; padding: 9px 18px;
      font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(79,70,229,.3); white-space: nowrap;
    }
    .btn-add:hover { background: var(--primary-h); box-shadow: 0 4px 12px rgba(79,70,229,.4); }
    .btn-add:active { transform: scale(.97); }

    /* ── Main ── */
    .main { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* ── Daily Word Banner ── */
    .daily-wrap { margin-bottom: 22px; }
    .daily-card {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: var(--radius); padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      color: white; box-shadow: 0 4px 20px rgba(79,70,229,.35);
    }
    .daily-left { flex: 1; min-width: 0; }
    .daily-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; opacity: .7; margin-bottom: 10px; text-transform: uppercase; }
    .daily-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .daily-word { font-size: 26px; font-weight: 900; line-height: 1.1; }
    .daily-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.2); flex-shrink: 0; }
    .daily-def { font-size: 14px; opacity: .85; line-height: 1.6; }
    .daily-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .daily-btn {
      width: 40px; height: 40px; border-radius: 12px; border: none;
      background: rgba(255,255,255,.15); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .daily-btn:hover { background: rgba(255,255,255,.28); }

    /* ── Test Mode Banner ── */
    .test-banner {
      display: none; background: #fffbeb; border: 1.5px solid #fcd34d;
      border-radius: 10px; padding: 10px 18px; margin-bottom: 18px;
      font-size: 13px; font-weight: 600; color: #92400e;
      display: none; align-items: center; gap: 10px;
    }
    .test-banner.show { display: flex; }
    .test-progress { margin-left: auto; font-size: 12px; color: #b45309; }

    /* ── Filter ── */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
    .filter-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
    .ftag { padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; font-size: 12.5px; cursor: pointer; color: var(--muted); transition: all .15s; }
    .ftag:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
    .ftag.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }

    /* ── Card ── */
    .card { background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--sh); overflow: hidden; transition: box-shadow .2s, transform .2s; animation: fadeUp .3s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
    .card:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
    .card-body { padding: 18px 20px 14px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-word { font-size: 20px; font-weight: 800; line-height: 1.2; color: var(--text); }
    .card-top-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; }
    .card-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .card-meta { font-size: 11.5px; color: #94a3b8; display: flex; gap: 12px; }
    .card-actions { display: flex; gap: 2px; }

    /* Icon buttons */
    .btn-icon {
      width: 28px; height: 28px; border-radius: 8px; border: none;
      background: transparent; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; color: #94a3b8;
    }
    .btn-icon:hover { background: var(--bg); }
    .btn-icon.edit:hover { color: var(--primary); }
    .btn-icon.del:hover { color: #ef4444; background: #fef2f2; }
    /* Speak button: hidden by default, show on card hover */
    .btn-speak { opacity: 0; transition: opacity .15s, background .15s; }
    .card:hover .btn-speak { opacity: 1; }
    .btn-speak:hover { color: #0ea5e9 !important; background: #f0f9ff !important; }

    /* ── Definition wrap (test mode) ── */
    .def-wrap { position: relative; margin-bottom: 10px; }
    .card-def { font-size: 13.5px; color: var(--muted); line-height: 1.65; transition: filter .35s; }
    .def-hint {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center;
      font-size: 12px; color: var(--muted); font-weight: 600;
      gap: 5px; pointer-events: none; border-radius: 6px;
      background: rgba(248,250,252,.6);
    }
    /* Test mode active styles */
    body.test-mode .def-wrap { cursor: pointer; border-radius: 8px; }
    body.test-mode .card-def { filter: blur(6px); user-select: none; }
    body.test-mode .def-hint { display: flex; }
    body.test-mode .card.revealed .card-def { filter: blur(0); }
    body.test-mode .card.revealed .def-hint { display: none; }
    /* Always show speak button in test mode */
    body.test-mode .btn-speak { opacity: 1; }

    /* tag colors */
    .tc0{background:#dbeafe;color:#1d4ed8;} .tc1{background:#dcfce7;color:#15803d;}
    .tc2{background:#fef9c3;color:#a16207;} .tc3{background:#ede9fe;color:#6d28d9;}
    .tc4{background:#fee2e2;color:#b91c1c;} .tc5{background:#fce7f3;color:#be185d;}
    .tc6{background:#ffedd5;color:#c2410c;} .tc7{background:#ccfbf1;color:#0f766e;}
    .tc-none{background:#f1f5f9;color:#475569;}

    /* ── Sections ── */
    .section { border-top: 1px solid var(--border); }
    .sec-hd { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; cursor: pointer; user-select: none; transition: background .15s; }
    .sec-hd:hover { background: var(--bg); }
    .sec-title { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .sec-cnt { background: var(--bg); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--muted); font-weight: 600; }
    .sec-arr { font-size: 10px; color: #94a3b8; transition: transform .2s; }
    .sec-arr.open { transform: rotate(180deg); }
    .sec-bd { display: none; padding: 4px 20px 14px; }
    .sec-bd.open { display: block; }
    .sec-item { background: var(--bg); border-radius: 9px; padding: 9px 12px; margin-bottom: 7px; font-size: 13px; line-height: 1.55; }
    .item-meta { font-size: 11px; color: #94a3b8; margin-top: 4px; display: flex; gap: 10px; }
    .item-meta .author { color: var(--primary-l); font-weight: 600; }
    .inp-row { display: flex; gap: 8px; margin-top: 10px; }
    .sec-inp { flex: 1; border: 1.5px solid var(--border); border-radius: 9px; padding: 8px 12px; font-size: 13px; outline: none; transition: border-color .2s; font-family: inherit; resize: none; background: white; line-height: 1.4; min-height: 36px; }
    .sec-inp:focus { border-color: var(--primary); }
    .btn-send { background: var(--primary); color: white; border: none; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; align-self: flex-end; transition: background .15s; }
    .btn-send:hover { background: var(--primary-h); }

    /* ── Empty / Loading ── */
    .placeholder { text-align: center; padding: 80px 20px; color: var(--muted); grid-column: 1/-1; }
    .ph-icon { font-size: 60px; margin-bottom: 14px; }
    .ph-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .ph-sub { font-size: 13px; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg);} }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: white; border-radius: 18px; padding: 28px 28px 24px; width: 100%; max-width: 460px; box-shadow: var(--sh-lg); transform: scale(.96) translateY(8px); transition: transform .2s; }
    .overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 20px; }
    .fg { margin-bottom: 14px; }
    .flabel { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: .4px; }
    .finput { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; font-family: inherit; }
    .finput:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .fta { min-height: 78px; resize: vertical; }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancel { flex: 1; background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-cancel:hover { background: var(--border); }
    .btn-ok { flex: 2; background: var(--primary); color: white; border: none; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .btn-ok:hover { background: var(--primary-h); }
    .btn-ok:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Confirm Dialog ── */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 340px; box-shadow: var(--sh-lg); transform: scale(.96); transition: transform .15s; text-align: center; }
    .confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-icon { font-size: 40px; margin-bottom: 12px; }
    .confirm-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .confirm-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .confirm-btns { display: flex; gap: 10px; }
    .btn-no { flex: 1; background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-no:hover { background: var(--border); }
    .btn-yes { flex: 1; background: #ef4444; color: white; border: none; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .btn-yes:hover { background: #dc2626; }

    /* ── Toast ── */
    .toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; pointer-events: none; align-items: center; }
    .toast { background: #1e293b; color: white; padding: 9px 20px; border-radius: 20px; font-size: 13px; box-shadow: var(--sh-md); animation: tIn .25s ease, tOut .25s ease 2.75s forwards; white-space: nowrap; }
    @keyframes tIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    @keyframes tOut { from{opacity:1;} to{opacity:0;transform:translateY(8px);} }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .header-inner { flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 10px; }
      .stats-bar { order: 3; width: 100%; gap: 12px; }
      .main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .logo { font-size: 16px; }
      .btn-outline span, .btn-add span { display: none; }
      .daily-card { flex-direction: column; align-items: flex-start; }
      .daily-word { font-size: 22px; }
      .btn-speak { opacity: 1; }
    }

    /* ── ⚔️ Challenge Mode ── */
    #chal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(10,10,20,.92); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }

    /* Setup */
    .chal-setup-box {
      background: white; border-radius: 20px; padding: 32px 28px 24px;
      width: 100%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,.4);
      animation: fadeUp .25s ease;
    }
    .chal-setup-title { font-size: 20px; font-weight: 900; margin-bottom: 24px; text-align: center; }
    .chal-setup-row { margin-bottom: 18px; }
    .chal-setup-row label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 8px; }
    .chal-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chal-chip {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
      background: white; font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--muted); transition: all .15s;
    }
    .chal-chip:hover { border-color: var(--primary); color: var(--primary); }
    .chal-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
    .chal-custom-input {
      width: 90px; border: 1.5px solid var(--border); border-radius: 20px;
      padding: 6px 14px; font-size: 13px; outline: none; text-align: center;
      transition: border-color .2s; font-family: inherit;
    }
    .chal-custom-input:focus { border-color: var(--primary); }
    .chal-select {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 9px 14px; font-size: 14px; outline: none; font-family: inherit;
      transition: border-color .2s; background: white; cursor: pointer;
    }
    .chal-select:focus { border-color: var(--primary); }
    .chal-setup-actions { display: flex; gap: 10px; margin-top: 24px; }
    .chal-btn-cancel {
      flex: 1; background: var(--bg); color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px; padding: 11px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .chal-btn-cancel:hover { background: var(--border); }
    .chal-btn-start {
      flex: 2; background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .chal-btn-start:hover { background: var(--primary-h); }

    /* Session topbar */
    .chal-topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 12px 20px; display: flex; align-items: center; gap: 14px;
      background: rgba(10,10,20,.8); backdrop-filter: blur(8px);
    }
    .chal-exit-btn {
      background: rgba(255,255,255,.12); color: white; border: none;
      border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s; white-space: nowrap; flex-shrink: 0;
    }
    .chal-exit-btn:hover { background: rgba(255,255,255,.22); }
    .chal-prog-wrap { flex: 1; }
    .chal-prog-track { height: 6px; background: rgba(255,255,255,.15); border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
    .chal-prog-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #4f46e5); border-radius: 6px; transition: width .4s ease; }
    .chal-prog-text { font-size: 11px; color: rgba(255,255,255,.6); text-align: center; }
    .chal-chips { display: flex; gap: 8px; flex-shrink: 0; }
    .chal-chip-ok { background: rgba(34,197,94,.2); color: #86efac; border: 1px solid rgba(34,197,94,.3); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
    .chal-chip-no { background: rgba(239,68,68,.2); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 700; }

    /* Session card */
    .chal-card-area { display: flex; align-items: center; justify-content: center; width: 100%; padding-top: 60px; }
    .chal-card {
      background: white; border-radius: 20px;
      padding: 40px 36px 32px; width: 100%; max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: chalSlide .3s ease;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    @keyframes chalSlide { from { opacity:0; transform:translateY(16px) scale(.97); } to { opacity:1; transform:none; } }
    .chal-word-text { font-size: 40px; font-weight: 900; color: var(--text); margin-bottom: 12px; line-height: 1.1; }
    .chal-tag-area { margin-bottom: 20px; min-height: 24px; }
    .chal-def-text { font-size: 16px; color: var(--muted); line-height: 1.7; margin-bottom: 24px; text-align: left; width: 100%; background: var(--bg); border-radius: 10px; padding: 14px 16px; }
    .chal-hint { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .chal-kbd { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; font-size: 11px; font-family: monospace; }

    /* Reveal button */
    .chal-reveal-btn {
      background: var(--primary); color: white; border: none;
      border-radius: 12px; padding: 13px 28px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s, transform .1s;
      box-shadow: 0 4px 16px rgba(79,70,229,.35); margin-bottom: 16px;
    }
    .chal-reveal-btn:hover { background: var(--primary-h); }
    .chal-reveal-btn:active { transform: scale(.97); }

    /* Speak button (in card) */
    .chal-speak-btn {
      background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 8px 16px; font-size: 14px; cursor: pointer; transition: all .15s;
      color: var(--muted);
    }
    .chal-speak-btn:hover { border-color: #0ea5e9; color: #0ea5e9; background: #f0f9ff; }

    /* Rate buttons */
    .chal-rate-row { display: flex; gap: 12px; width: 100%; }
    .chal-btn-no {
      flex: 1; background: #fef2f2; color: #ef4444; border: 2px solid #fecaca;
      border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all .15s;
    }
    .chal-btn-no:hover { background: #fee2e2; border-color: #ef4444; }
    .chal-btn-ok {
      flex: 1; background: #f0fdf4; color: #22c55e; border: 2px solid #bbf7d0;
      border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all .15s;
    }
    .chal-btn-ok:hover { background: #dcfce7; border-color: #22c55e; }

    /* Spell input */
    .chal-spell-input {
      width: 100%; border: 2px solid var(--border); border-radius: 12px;
      padding: 14px 18px; font-size: 18px; outline: none; text-align: center;
      font-family: inherit; font-weight: 600; transition: border-color .2s, box-shadow .2s;
      margin-bottom: 14px; letter-spacing: .5px;
    }
    .chal-spell-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .chal-spell-input.correct { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
    .chal-spell-input.near { border-color: #f59e0b; background: #fffbeb; color: #a16207; }
    .chal-spell-input.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
    .chal-spell-actions { display: flex; gap: 10px; width: 100%; }
    .chal-btn-skip {
      flex: 1; background: var(--bg); color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .chal-btn-skip:hover { background: var(--border); }
    .chal-btn-submit {
      flex: 2; background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .chal-btn-submit:hover { background: var(--primary-h); }
    .chal-btn-next {
      width: 100%; background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s; margin-top: 14px;
    }
    .chal-btn-next:hover { background: var(--primary-h); }

    /* Spell result */
    .chal-result-icon { font-size: 36px; margin-bottom: 8px; }
    .chal-result-label { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .chal-correct-word { font-size: 22px; font-weight: 900; color: var(--primary); margin: 4px 0 12px; }
    .chal-attempts-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* Summary */
    .chal-summary-box {
      background: white; border-radius: 20px; padding: 36px 28px 28px;
      width: 100%; max-width: 460px; box-shadow: 0 30px 60px rgba(0,0,0,.4);
      animation: fadeUp .3s ease; max-height: 90vh; overflow-y: auto;
    }
    .chal-summary-title { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 6px; }
    .chal-score-circle {
      width: 100px; height: 100px; border-radius: 50%; margin: 20px auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900; color: white;
    }
    .chal-score-circle.great { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .chal-score-circle.good { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .chal-score-circle.poor { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .chal-score-sub { font-size: 11px; font-weight: 600; opacity: .8; }
    .chal-summary-stats { display: flex; gap: 10px; margin: 16px 0; }
    .chal-stat-box {
      flex: 1; border-radius: 12px; padding: 14px 10px; text-align: center;
    }
    .chal-stat-box.ok { background: #f0fdf4; }
    .chal-stat-box.no { background: #fef2f2; }
    .chal-stat-box.near { background: #fffbeb; }
    .chal-stat-n { font-size: 24px; font-weight: 900; }
    .chal-stat-box.ok .chal-stat-n { color: #22c55e; }
    .chal-stat-box.no .chal-stat-n { color: #ef4444; }
    .chal-stat-box.near .chal-stat-n { color: #f59e0b; }
    .chal-stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .chal-miss-list { margin: 14px 0; }
    .chal-miss-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
    .chal-miss-item { background: var(--bg); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; display: flex; gap: 10px; }
    .chal-miss-word { font-weight: 700; color: var(--text); flex-shrink: 0; }
    .chal-miss-def { color: var(--muted); }
    .chal-summary-actions { display: flex; gap: 10px; margin-top: 20px; }
    .chal-btn-again {
      flex: 1; background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    .chal-btn-again:hover { background: var(--primary-h); }
    .chal-btn-back {
      flex: 1; background: var(--bg); color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px;

    }

    @media (max-width: 480px) {
      .chal-word-text { font-size: 30px; }
      .chal-card { padding: 28px 20px 24px; }

    /* ── Import Overlay ── */
    #import-overlay {
      position: fixed; inset: 0; z-index: 600;

    }
    .import-box {
      background: white; border-radius: 20px; padding: 32px 28px 24px;

    }
    .import-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
    .import-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
    .import-file-zone {
      display: flex; align-items: center; justify-content: center;
      border: 2px dashed var(--border); border-radius: 12px; padding: 22px;
      cursor: pointer; transition: border-color .2s, background .2s; margin-bottom: 14px; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--muted);
    }
    .import-file-zone:hover { border-color: var(--primary); background: #f0f0ff; color: var(--primary); }
    .import-stats { font-size: 13px; color: var(--muted); margin-bottom: 10px; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
    .import-preview-list { max-height: 180px; overflow-y: auto; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px; }
    .import-word-row { display: flex; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .import-word-row:last-child { border-bottom: none; }
    .iw-word { font-weight: 700; min-width: 110px; flex-shrink: 0; }
    .iw-def { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .import-more { font-size: 12px; color: var(--muted); padding: 7px 12px; }
    .import-actions { display: flex; gap: 10px; margin-top: 4px; }
    .import-btn-cancel {
      flex: 1; background: var(--bg); color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px; padding: 11px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .import-btn-cancel:hover { background: var(--border); }
    .import-btn-go {
      flex: 2; background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .import-btn-go:hover:not(:disabled) { background: var(--primary-h); }
    .import-btn-go:disabled { background: #94a3b8; cursor: not-allowed; }

    /* ── Print / PDF ── */
    @media print {
      .header, .filter-bar, .daily-wrap, .test-banner, .card-actions, .inp-row, .sec-arr, .btn-send, .def-hint { display: none !important; }
      body { background: white; }
      body.test-mode .card-def { filter: none !important; }
      .main { padding: 0; }
      .grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .card { break-inside: avoid; box-shadow: none !important; transform: none !important; animation: none !important; border: 1px solid #cbd5e1; }
      .sec-bd { display: block !important; }
      .sec-hd { pointer-events: none; }
      @page { margin: 1.2cm; }
    }
  </style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDQCMpEeUsbg2ld4La3iHvzFKQZQCavm0k",
    authDomain: "co-sharing-wordnote.firebaseapp.com",
    databaseURL: "https://co-sharing-wordnote-default-rtdb.firebaseio.com",
    projectId: "co-sharing-wordnote",
    messagingSenderId: "63640681458",
    appId: "1:63640681458:web:8586a9cd864f9ee0c7096b"
  });
  const db = firebase.database();
  const wordsRef = db.ref('words');

  /* ── Nickname ── */
  const nickEl = document.getElementById('nick');
  nickEl.value = localStorage.getItem('nick') || '';
  nickEl.addEventListener('input', () => localStorage.setItem('nick', nickEl.value.trim()));
  const getNick = () => nickEl.value.trim() || '匿名';

  /* ── Tag colors ── */
  const tagColorMap = {};
  let colorIdx = 0;
  function tagColor(t) {
    if (!t) return 'tc-none';
    if (!tagColorMap[t]) tagColorMap[t] = 'tc' + (colorIdx++ % 8);
    return tagColorMap[t];
  }

  /* ── State ── */
  let allWords = {};
  let activeFilter = 'all';
  const openSections = new Set();
  let editingId = null;
  let testMode = false;
  const revealedCards = new Set();
  let manualDailyIdx = null;
  let firstRender = true;

  /* ── Firebase ── */
  wordsRef.on('value', snap => {
    allWords = snap.val() || {};
    renderStats();
    renderFilters();
    renderCards();
    renderDailyWord();
    firstRender = false;
  });

  function renderStats() {
    let w = 0, s = 0, c = 0;
    for (const d of Object.values(allWords)) {
      w++;
      s += d.supplements ? Object.keys(d.supplements).length : 0;
      c += d.comments ? Object.keys(d.comments).length : 0;
    }
    document.getElementById('sw').textContent = w;
    document.getElementById('ss').textContent = s;
    document.getElementById('sc').textContent = c;
  }

  function renderFilters() {
    const tags = new Set(['all']);
    for (const d of Object.values(allWords)) if (d.tag) tags.add(d.tag);
    const bar = document.getElementById('filter-bar');
    bar.innerHTML = '<span class="filter-label">筛选：</span>';
    for (const tag of tags) {
      const btn = document.createElement('button');
      btn.className = 'ftag' + (tag === activeFilter ? ' active' : '');
      btn.dataset.tag = tag;
      btn.textContent = tag === 'all' ? '全部' : tag;
      btn.onclick = () => { activeFilter = tag; renderFilters(); renderCards(); };
      bar.appendChild(btn);
    }
  }

  function renderCards() {
    const grid = document.getElementById('grid');
    const entries = Object.entries(allWords).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
    const filtered = activeFilter === 'all' ? entries : entries.filter(([, d]) => d.tag === activeFilter);

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="placeholder">
        <div class="ph-icon">📭</div>
        <div class="ph-title">${activeFilter === 'all' ? '单词本还是空的' : '该分类暂无单词'}</div>
        <div class="ph-sub">${activeFilter === 'all' ? '点击「添加单词」开始共享你的知识' : '切换其他分类或添加新单词'}</div>
      </div>`;
      return;
    }

    // Save in-progress state
    const saved = {};
    grid.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      if (!id) return;
      const [sInp, cInp] = card.querySelectorAll('.sec-inp');
      saved[id] = {
        sOpen: openSections.has(id + '-s'),
        cOpen: openSections.has(id + '-c'),
        sVal: sInp ? sInp.value : '',
        cVal: cInp ? cInp.value : '',
      };
    });

    grid.innerHTML = '';
    filtered.forEach(([id, d], i) => {
      const card = buildCard(id, d);
      if (firstRender) card.style.animationDelay = Math.min(i * 30, 200) + 'ms';
      grid.appendChild(card);
      if (saved[id]) restoreCard(card, saved[id]);
      if (revealedCards.has(id)) card.classList.add('revealed');
    });

    updateTestBanner();
  }

  function restoreCard(card, st) {
    if (st.sOpen) { card.querySelector('.sec-bd-s')?.classList.add('open'); card.querySelector('.sec-arr-s')?.classList.add('open'); }
    if (st.cOpen) { card.querySelector('.sec-bd-c')?.classList.add('open'); card.querySelector('.sec-arr-c')?.classList.add('open'); }
    const [sInp, cInp] = card.querySelectorAll('.sec-inp');
    if (sInp && st.sVal) sInp.value = st.sVal;
    if (cInp && st.cVal) cInp.value = st.cVal;
  }

  function buildCard(id, d) {
    const supps = d.supplements ? Object.entries(d.supplements).sort((a,b) => a[1].timestamp - b[1].timestamp) : [];
    const comms = d.comments ? Object.entries(d.comments).sort((a,b) => a[1].timestamp - b[1].timestamp) : [];

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = id;

    card.innerHTML = `
      <div class="card-body">
        <div class="card-top">
          <div class="card-word">${esc(d.word)}</div>
          <div class="card-top-right">
            ${d.tag ? `<span class="card-tag ${tagColor(d.tag)}">${esc(d.tag)}</span>` : ''}
            <button class="btn-icon btn-speak" title="朗读单词">🔊</button>
          </div>
        </div>
        ${d.definition ? `
          <div class="def-wrap">
            <div class="card-def">${esc(d.definition)}</div>
            <div class="def-hint">👁 点击查看释义</div>
          </div>` : ''}
        <div class="card-footer">
          <div class="card-meta">
            <span>👤 ${esc(d.addedBy || '匿名')}</span>
            <span>🕐 ${ago(d.timestamp)}</span>
          </div>
          <div class="card-actions">
            <button class="btn-icon edit" title="编辑">✏️</button>
            <button class="btn-icon del" title="删除">🗑️</button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="sec-hd" data-type="s">
          <div class="sec-title">💡 补充栏 <span class="sec-cnt">${supps.length}</span></div>

    card.querySelectorAll('.btn-send').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = btn.previousElementSibling;

        if (!content) { toast('请输入内容'); return; }
        const path = btn.dataset.type === 'supp' ? `words/${id}/supplements` : `words/${id}/comments`;
        const label = btn.dataset.type === 'supp' ? '补充' : '留言';
        btn.disabled = true; inp.value = '';
        db.ref(path).push({ content, addedBy: getNick(), timestamp: Date.now() })
          .then(() => toast(label + '已发送 ✓'))
          .catch(() => { toast('发送失败，请检查网络'); inp.value = content; })
          .finally(() => btn.disabled = false);

    // Edit / Delete

    // 🔊 Speak button

    // 测试模式：点击释义区域揭示

    return card;
  }

  /* ── 🔊 TTS 朗读 ── */
  function speak(text) {
    if (!window.speechSynthesis) { toast('浏览器不支持朗读功能'); return; }
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    // 简单判断语言：纯 ASCII 视为英文，否则中文
    utt.lang = /^[\x00-\x7F\s\-']+$/.test(text) ? 'en-US' : 'zh-CN';
    utt.rate = 0.85;
    window.speechSynthesis.speak(utt);
  }

  /* ── 📅 今日词汇 ── */
  function renderDailyWord() {
    const entries = Object.entries(allWords);
    const wrap = document.getElementById('daily-wrap');
    if (entries.length === 0) { wrap.style.display = 'none'; return; }

    let idx;
    if (manualDailyIdx !== null) {
      idx = manualDailyIdx % entries.length;
    } else {
      // 用日期字符串做哈希，同一天始终显示同一个词
      const dateStr = new Date().toDateString();
      let hash = 0;
      for (let i = 0; i < dateStr.length; i++) hash = (hash * 31 + dateStr.charCodeAt(i)) >>> 0;
      idx = hash % entries.length;
    }

    const [, d] = entries[idx];
    document.getElementById('dw-word').textContent = d.word || '';
    const tagEl = document.getElementById('dw-tag');
    if (d.tag) { tagEl.textContent = d.tag; tagEl.style.display = ''; }
    else { tagEl.style.display = 'none'; }
    document.getElementById('dw-def').textContent = d.definition || '（暂无释义）';
    wrap.style.display = '';

    document.getElementById('dw-speak').onclick = () => speak(d.word);
  }

  document.getElementById('dw-shuffle').onclick = () => {
    const len = Object.keys(allWords).length;
    if (len === 0) return;
    manualDailyIdx = Math.floor(Math.random() * len);
    renderDailyWord();
  };

  /* ── 🧪 测试模式 ── */
  document.getElementById('btn-test').addEventListener('click', () => {
    testMode = !testMode;
    document.body.classList.toggle('test-mode', testMode);
    const btn = document.getElementById('btn-test');
    btn.classList.toggle('active', testMode);
    btn.innerHTML = testMode ? '✅ <span>退出测试</span>' : '🧪 <span>测试模式</span>';

      revealedCards.clear();

  /* ── Add / Edit Modal ── */

    document.getElementById('it').value = d.tag || '';

  document.getElementById('btn-cancel').onclick = closeModal;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeConfirm(); } });
  document.getElementById('iw').addEventListener('keydown', e => { if (e.key === 'Enter') submitWord(); });

  function closeModal() { overlay.classList.remove('open'); editingId = null; }

  document.getElementById('btn-ok').onclick = submitWord;

  function submitWord() {
    const word = document.getElementById('iw').value.trim();
    const tag  = document.getElementById('it').value.trim();

  /* ── Import ── */

  document.getElementById('btn-import').onclick = () => {

  };

  document.getElementById('import-cancel').onclick = () => {

  };

  document.getElementById('import-file-zone').onclick = () => {

  };

  document.getElementById('import-file-input').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('import-file-text').textContent = '⏳ ' + file.name;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const raw = JSON.parse(ev.target.result);
        const entries = Array.isArray(raw) ? raw : (raw.words || raw.data || Object.values(raw));
        const studied = entries.filter(w => w.word && (w.repetitions || 0) > 0);
        const existingWords = new Set(Object.values(allWords).map(d => (d.word || '').toLowerCase()));
        importWords = studied.filter(w => !existingWords.has(w.word.toLowerCase()));
        const dupCount = studied.length - importWords.length;

        document.getElementById('import-stats').textContent =
          `共 ${entries.length} 条 → 已复习 ${studied.length} 个 → 新词 ${importWords.length} 个（跳过重复 ${dupCount} 个）`;

        const list = document.getElementById('import-preview-list');
        list.innerHTML = importWords.slice(0, 20).map(w =>
          `<div class="import-word-row"><span class="iw-word">${esc(w.word)}</span><span class="iw-def">${esc(w.meaning || w.definition || '')}</span></div>`
        ).join('') + (importWords.length > 20 ? `<div class="import-more">…还有 ${importWords.length - 20} 个</div>` : '');

        document.getElementById('import-preview').style.display = '';
        document.getElementById('import-go').disabled = importWords.length === 0;
        document.getElementById('import-file-text').textContent = '✅ ' + file.name;
      } catch {
        document.getElementById('import-file-text').textContent = '❌ 解析失败，请检查文件格式';
      }
    };
    reader.readAsText(file, 'utf-8');

  document.getElementById('import-go').onclick = async () => {

      btn.textContent = `导入中 ${++count}/${importWords.length}…`;
      await db.ref('words').push({
        word: w.word,

      });

  /* ── PDF Export ── */
  document.getElementById('btn-pdf').onclick = () => {

    window.print();
    setTimeout(() => {
      document.querySelectorAll('.sec-bd').forEach(bd => {

        const id = card?.dataset.id;
        const type = bd.classList.contains('sec-bd-s') ? 's' : 'c';
        if (!openSections.has(id + '-' + type)) bd.classList.remove('open');
      });
    }, 1000);
  };

  /* ── ⚔️ Challenge Mode ── */
  const ch = {
    words: [], idx: 0, mode: 'flash', count: 10,
    ok: 0, near: 0, no: 0,
    revealed: false, spellResult: null, attempts: 0,
    missed: []   // words marked 不认识 or wrong
  };

  function chalScreen(id) {
    ['chal-setup','chal-session','chal-summary'].forEach(s => {
      document.getElementById(s).style.display = s === id ? '' : 'none';
    });
  }

  // Open setup
  document.getElementById('btn-chal').addEventListener('click', () => {
    // Populate tag filter
    const sel = document.getElementById('chal-tag-sel');
    const tags = new Set(Object.values(allWords).map(d => d.tag).filter(Boolean));

    document.getElementById('chal-overlay').style.display = 'flex';
    chalScreen('chal-setup');
  });

  // Chip selectors in setup
  document.getElementById('chal-overlay').addEventListener('click', e => {
    const chip = e.target.closest('.chal-chip[data-n]');
    if (chip) {
      chip.closest('.chal-chip-row').querySelectorAll('.chal-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      document.getElementById('chal-n-custom').value = '';
    }
    const mchip = e.target.closest('.chal-chip[data-mode]');
    if (mchip) {
      mchip.closest('.chal-chip-row').querySelectorAll('.chal-chip').forEach(c => c.classList.remove('active'));
      mchip.classList.add('active');
    }
  });

  document.getElementById('chal-cancel').onclick = closeChal;
  document.getElementById('chal-exit').onclick = closeChal;

  function closeChal() {
    document.getElementById('chal-overlay').style.display = 'none';
    removeChalKey();
  }

  document.getElementById('chal-start').onclick = () => {
    const overlay = document.getElementById('chal-overlay');
    // Get count
    const customVal = parseInt(document.getElementById('chal-n-custom').value);
    const activeChip = overlay.querySelector('.chal-chip[data-n].active');
    const count = !isNaN(customVal) && customVal > 0 ? customVal : (activeChip ? parseInt(activeChip.dataset.n) : 10);
    // Get mode
    const modeChip = overlay.querySelector('.chal-chip[data-mode].active');
    const mode = modeChip ? modeChip.dataset.mode : 'flash';
    // Get tag filter
    const tag = document.getElementById('chal-tag-sel').value;
    // Pick words
    let pool = Object.values(allWords).filter(d => d.word);
    if (tag !== 'all') pool = pool.filter(d => d.tag === tag);
    if (mode === 'spell') pool = pool.filter(d => d.definition); // need definition for spelling
    if (!pool.length) { toast('当前范围没有可用单词'); return; }
    // Shuffle and slice
    const shuffled = pool.sort(() => Math.random() - .5).slice(0, Math.min(count, pool.length));
    // Init state
    ch.words = shuffled; ch.idx = 0; ch.mode = mode; ch.count = shuffled.length;
    ch.ok = 0; ch.near = 0; ch.no = 0; ch.missed = [];
    ch.revealed = false; ch.spellResult = null; ch.attempts = 0;
    updateChalScore();
    chalScreen('chal-session');
    renderChalCard();
    addChalKey();
  };

  function renderChalCard() {
    const word = ch.words[ch.idx];
    const el = document.getElementById('chal-card');
    // Progress
    const pct = (ch.idx / ch.count) * 100;
    document.getElementById('chal-fill').style.width = pct + '%';
    document.getElementById('chal-prog').textContent = (ch.idx + 1) + ' / ' + ch.count;

    if (ch.mode === 'flash') renderFlash(word, el);
    else renderSpell(word, el);
  }

  function renderFlash(w, el) {
    if (!ch.revealed) {
      el.innerHTML = `
        <div class="chal-card">
          <div class="chal-word-text">${esc(w.word)}</div>
          <div class="chal-tag-area">${w.tag ? `<span class="card-tag ${tagColor(w.tag)}">${esc(w.tag)}</span>` : ''}</div>
          <div class="chal-hint">认识这个词吗？先想一想</div>
          <button class="chal-reveal-btn" id="ch-reveal">👁 查看释义 <span class="chal-kbd">F</span></button>
          <button class="chal-speak-btn" style="margin-top:10px" id="ch-speak">🔊 朗读</button>
        </div>`;
      document.getElementById('ch-reveal').onclick = () => { ch.revealed = true; renderChalCard(); };
      document.getElementById('ch-speak').onclick = () => speak(w.word);
    } else {
      el.innerHTML = `
        <div class="chal-card">
          <div class="chal-word-text">${esc(w.word)}</div>
          ${w.definition ? `<div class="chal-def-text">${esc(w.definition)}</div>` : '<div class="chal-hint">（暂无释义）</div>'}
          <button class="chal-speak-btn" style="margin-bottom:20px" id="ch-speak">🔊 朗读</button>
          <div class="chal-rate-row">
            <button class="chal-btn-no" id="ch-no">❌ 不认识</button>
            <button class="chal-btn-ok" id="ch-ok">✅ 认识</button>
          </div>
          <div class="chal-hint" style="margin-top:12px">← 不认识 &nbsp;|&nbsp; → 认识</div>
        </div>`;
      document.getElementById('ch-speak').onclick = () => speak(w.word);
      document.getElementById('ch-no').onclick = () => rateFlash(false);
      document.getElementById('ch-ok').onclick = () => rateFlash(true);
    }
  }

  function rateFlash(known) {
    if (known) ch.ok++; else { ch.no++; ch.missed.push(ch.words[ch.idx]); }
    updateChalScore();
    chalNext();
  }

  function renderSpell(w, el) {
    if (!ch.spellResult) {
      el.innerHTML = `
        <div class="chal-card">
          <div class="chal-hint" style="margin-bottom:8px">根据释义，拼写出单词</div>
          <div class="chal-def-text">${esc(w.definition || '（暂无释义）')}</div>
          ${ch.attempts > 0 ? `<div class="chal-attempts-hint">第 ${ch.attempts+1} 次尝试（最多3次）</div>` : ''}
          <input class="chal-spell-input" id="ch-input" type="text" placeholder="输入单词…" autocomplete="off">
          <div class="chal-spell-actions">
            <button class="chal-btn-skip" id="ch-skip">跳过</button>
            <button class="chal-btn-submit" id="ch-submit">提交 <span class="chal-kbd">Enter</span></button>
          </div>
        </div>`;
      const inp = document.getElementById('ch-input');
      inp.focus();
      document.getElementById('ch-submit').onclick = submitSpell;
      document.getElementById('ch-skip').onclick = () => {
        ch.spellResult = 'wrong'; ch.no++; ch.missed.push(w); updateChalScore(); renderChalCard();
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitSpell(); } });
    } else {
      const icons = { correct:'✅', near:'🟡', wrong:'❌' };
      const labels = { correct:'拼写正确！', near:'非常接近', wrong:'拼写错误' };
      const colors = { correct:'#22c55e', near:'#f59e0b', wrong:'#ef4444' };
      const r = ch.spellResult;
      el.innerHTML = `
        <div class="chal-card">
          <div class="chal-result-icon">${icons[r]}</div>
          <div class="chal-result-label" style="color:${colors[r]}">${labels[r]}</div>
          <div class="chal-correct-word">${esc(w.word)}</div>
          ${w.definition ? `<div class="chal-def-text">${esc(w.definition)}</div>` : ''}
          <button class="chal-speak-btn" id="ch-speak">🔊 朗读正确答案</button>
          <button class="chal-btn-next" id="ch-next">下一个 <span class="chal-kbd">Enter</span></button>
        </div>`;
      document.getElementById('ch-speak').onclick = () => speak(w.word);
      document.getElementById('ch-next').onclick = chalNext;
    }
  }

  function submitSpell() {
    const inp = document.getElementById('ch-input');
    if (!inp) return;
    const answer = inp.value.trim();
    if (!answer) return;
    const w = ch.words[ch.idx];
    const dist = levenshtein(answer, w.word);
    let result;
    if (answer.toLowerCase() === w.word.toLowerCase()) result = 'correct';
    else if (dist <= 1) result = 'near';
    else if (ch.attempts < 2) {
      // Give another chance
      ch.attempts++;
      inp.classList.add('wrong');
      setTimeout(() => { inp.classList.remove('wrong'); inp.value = ''; inp.focus(); }, 600);
      return;
    } else result = 'wrong';

    ch.spellResult = result;
    if (result === 'correct') ch.ok++;
    else if (result === 'near') ch.near++;
    else { ch.no++; ch.missed.push(w); }
    updateChalScore();
    renderChalCard();
  }

  function levenshtein(a, b) {
    const s = a.toLowerCase().trim(), t = b.toLowerCase().trim();
    if (!s) return t.length; if (!t) return s.length;
    const d = Array.from({length: s.length+1}, (_, i) => Array.from({length: t.length+1}, (_, j) => j === 0 ? i : 0));
    for (let j = 1; j <= t.length; j++) d[0][j] = j;
    for (let i = 1; i <= s.length; i++)
      for (let j = 1; j <= t.length; j++)
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(s[i-1]===t[j-1]?0:1));
    return d[s.length][t.length];
  }

  function chalNext() {
    ch.idx++;
    ch.revealed = false; ch.spellResult = null; ch.attempts = 0;
    if (ch.idx >= ch.words.length) { showChalSummary(); return; }
    renderChalCard();
  }

  function updateChalScore() {
    document.getElementById('chal-c-ok').textContent = '✅ ' + (ch.ok + ch.near);
    document.getElementById('chal-c-no').textContent = '❌ ' + ch.no;
  }

  function showChalSummary() {
    chalScreen('chal-summary');
    const total = ch.count;
    const okTotal = ch.ok + ch.near;
    const pct = Math.round((okTotal / total) * 100);
    const grade = pct >= 80 ? 'great' : pct >= 50 ? 'good' : 'poor';
    const gradeLabel = pct >= 80 ? '太棒了！' : pct >= 50 ? '继续加油' : '需要强化';
    const modeLabel = ch.mode === 'flash' ? '认识模式' : '拼写模式';

    let missedHtml = '';
    if (ch.missed.length) {
      missedHtml = `<div class="chal-miss-list">
        <div class="chal-miss-title">⚠️ 需要加强的单词 (${ch.missed.length})</div>
        ${ch.missed.map(w => `
          <div class="chal-miss-item">
            <span class="chal-miss-word">${esc(w.word)}</span>
            <span class="chal-miss-def">${esc((w.definition||'').substring(0,40))}${w.definition && w.definition.length > 40 ? '…' : ''}</span>
          </div>`).join('')}
      </div>`;
    }

    document.getElementById('chal-summary-box').innerHTML = `
      <div class="chal-summary-title">${gradeLabel}</div>
      <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px">${modeLabel} · ${total} 个单词</div>
      <div class="chal-score-circle ${grade}">
        <div>${pct}%</div>
        <div class="chal-score-sub">${okTotal}/${total}</div>
      </div>
      <div class="chal-summary-stats">
        <div class="chal-stat-box ok"><div class="chal-stat-n">${ch.ok}</div><div class="chal-stat-label">✅ 认识</div></div>
        ${ch.mode === 'spell' ? `<div class="chal-stat-box near"><div class="chal-stat-n">${ch.near}</div><div class="chal-stat-label">🟡 接近</div></div>` : ''}
        <div class="chal-stat-box no"><div class="chal-stat-n">${ch.no}</div><div class="chal-stat-label">❌ 不认识</div></div>
      </div>
      ${missedHtml}
      <div class="chal-summary-actions">
        <button class="chal-btn-again" id="chal-again">🔄 再来一次</button>
        <button class="chal-btn-back" id="chal-back">返回单词本</button>
      </div>`;

    document.getElementById('chal-again').onclick = () => document.getElementById('chal-start').click();
    document.getElementById('chal-back').onclick = closeChal;
    removeChalKey();
  }

  // Keyboard shortcuts for challenge
  function chalKeyHandler(e) {
    if (document.getElementById('chal-overlay').style.display === 'none') return;
    if (document.getElementById('chal-session').style.display === 'none') return;

    const w = ch.words[ch.idx];
    if (ch.mode === 'flash') {
      if (!ch.revealed && (e.key === 'f' || e.key === 'F' || e.key === ' ')) {
        e.preventDefault(); ch.revealed = true; renderChalCard();
      } else if (ch.revealed && (e.key === 'ArrowRight' || e.key === '2')) {
        e.preventDefault(); rateFlash(true);
      } else if (ch.revealed && (e.key === 'ArrowLeft' || e.key === '1')) {
        e.preventDefault(); rateFlash(false);
      }
    } else {
      if (ch.spellResult && e.key === 'Enter') {
        e.preventDefault(); chalNext();
      }
    }
    if (e.key === 'Escape') closeChal();
  }

  function addChalKey() { document.addEventListener('keydown', chalKeyHandler); }
  function removeChalKey() { document.removeEventListener('keydown', chalKeyHandler); }

  /* ── Helpers ── */
  function ago(ts) {
    if (!ts) return '未知时间';
    const d = Date.now() - ts;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return ~~(d/60000) + ' 分钟前';
    if (d < 86400000) return ~~(d/3600000) + ' 小时前';
    return ~~(d/86400000) + ' 天前';
  }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function toast(msg) {
    const c = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
</script>
</body>
</html>
